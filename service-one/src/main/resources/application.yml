# GLOBAL CONFIGURATION

spring:
  application.name: service-one
  jackson.serializationindent_output: true

info:
  component: Service-One
  artifact: service-one
  version: 5.0.0

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

server:
  port: 8082
  servlet:
    context-path: /

---
#DEFAULT CONFIGURATION
spring:
  profiles: default
  autoconfigure.exclude:
    - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
    - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  cloud.consul.enabled: false
  data.mongodb.uri: mongodb://localhost:27017/service-one
logging:
  level:
    org.springframework.web: DEBUG
    com.mudigal.one: DEBUG
    org.hibernate: DEBUG

---
# DOCKER CONFIGURATION
spring:
  profiles: docker
  autoconfigure.exclude:
    - org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        hostName: service-one
        instanceId: ${spring.application.name}:${spring.application.instance_id:${random.value}}
        healthCheckPath: /actuator/health
        healthCheckInterval: 15s
  data:
    mongodb.uri: mongodb://service-one-db/service-one
  rabbitmq:
    host: rabbit
    port: 5672
    username: mudigal
    password: mudigal
    virtualHost: /

logstash.servers: logstash:5001

logging:
  level:
    org.springframework.web: DEBUG
    com.mudigal.one: DEBUG
    org.hibernate: DEBUG
