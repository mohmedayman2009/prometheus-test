global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'service-one'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['service-one:8082']
  - job_name: 'service-two'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['service-two:8084']
  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
